name: Vision Pipeline CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 \
            libglib2.0-0 \
            libsm6 \
            libxext6 \
            libxrender-dev \
            libxcb1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run integration tests
        run: pytest -vv tests/integration
      
      - name: Run unit tests
        run: pytest -vv tests/unit

      # Future quality checks
      #
      # - name: Ruff
      #   run: ruff check .
      #
      # - name: Black
      #   run: black --check .
      #
      # - name: isort
      #   run: isort --check-only .